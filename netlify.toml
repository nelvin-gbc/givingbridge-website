# GivingBridge Consulting: Netlify config (static site, no build step)

[build]
  publish = "."

# ---------------------------------------------------------------------------
# Never serve repo/internal files
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/_internal/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/concepts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.gitignore"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

# One canonical URL for the homepage
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# Security headers (every response)
# CSP allows only what the site uses: Google Fonts and the HubSpot form embed
# (js-na2.hsforms.net / forms-na2.hsforms.com). 'unsafe-inline' is needed for
# the small inline scripts/styles and for HubSpot's iframe, which injects its
# own inline script and styles.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://js-na2.hsforms.net https://js.hsforms.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https://*.hsforms.com https://*.hsforms.net https://*.hubspot.com https://*.hubspotusercontent-na2.net; connect-src 'self' https://*.hsforms.com https://*.hsforms.net https://*.hubspot.com https://*.hubapi.com; frame-src 'self' https://*.hsforms.com https://*.hsforms.net https://*.hubspot.com; form-action 'self' https://*.hsforms.com https://*.hubspot.com; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"

# Private pages: keep out of search results
[[headers]]
  for = "/health-check/questionnaire/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/health-check/thanks/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# ---------------------------------------------------------------------------
# Caching
# ---------------------------------------------------------------------------
# HTML always revalidates so deploys show immediately
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Assets (CSS, images, icons): file names don't change between deploys, so
# keep the cache short and revalidate.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
