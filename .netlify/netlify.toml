[[headers]]
for = "/*"

[headers.values]
Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://js-na2.hsforms.net https://js.hsforms.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https://*.hsforms.com https://*.hsforms.net https://*.hubspot.com https://*.hubspotusercontent-na2.net; connect-src 'self' https://*.hsforms.com https://*.hsforms.net https://*.hubspot.com https://*.hubapi.com; frame-src 'self' https://*.hsforms.com https://*.hsforms.net https://*.hubspot.com; form-action 'self' https://*.hsforms.com https://*.hubspot.com; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
Strict-Transport-Security = "max-age=31536000; includeSubDomains"
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
Cross-Origin-Opener-Policy = "same-origin"
X-Permitted-Cross-Domain-Policies = "none"

[[headers]]
for = "/health-check/questionnaire/*"

[headers.values]
X-Robots-Tag = "noindex, nofollow"
Cache-Control = "no-store"

[[headers]]
